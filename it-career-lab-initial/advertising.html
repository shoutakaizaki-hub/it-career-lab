<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>広告・PR表記｜IT研究室</title><link rel="stylesheet" href="css/style.css"></head><body><main class="section"><div class="container narrow"><article class="article"><p class="eyebrow">Advertising</p><h1>広告・PR表記</h1><p>IT研究室では、アフィリエイトプログラムを利用した広告を掲載する場合があります。</p><p>広告リンクを経由してサービスへの申込・登録等が行われた場合、当サイト運営者に報酬が発生することがあります。</p><p>広告を含むページ・投稿では、必要に応じて「PR」「広告」等の表示を行います。</p><p>サービスの紹介内容は、広告主の公式情報や公開情報を確認し、事実と異なる表現や誤認を招く表現を避けます。</p><p><a href="index.html">トップへ戻る</a></p></article></div></main></body></html>
