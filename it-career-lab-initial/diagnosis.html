<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="20代ITエンジニア向け転職タイプ診断。現在の経験や希望からキャリアの方向性を確認できます。">
  <title>20代ITエンジニア転職診断｜IT研究室</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">IT研究室</a>
      <nav class="nav">
        <a class="active" href="diagnosis.html">転職診断</a>
        <a href="compare.html">サービス比較</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container narrow">
      <p class="eyebrow">Career Diagnosis</p>
      <h1>20代ITエンジニア転職診断</h1>
      <p class="lead small">現在の経験や希望を選ぶと、検討しやすいキャリア方向を表示します。</p>

      <form id="diagnosisForm" class="form-card">
        <div class="form-group">
          <label for="age">年齢</label>
          <select id="age" required>
            <option value="">選択してください</option>
            <option value="22-24">22〜24歳</option>
            <option value="25-27">25〜27歳</option>
            <option value="28-29">28〜29歳</option>
            <option value="30+">30歳以上</option>
          </select>
        </div>

        <div class="form-group">
          <label for="experience">IT経験年数</label>
          <select id="experience" required>
            <option value="">選択してください</option>
            <option value="0-1">1年未満</option>
            <option value="1-3">1〜3年</option>
            <option value="3-5">3〜5年</option>
            <option value="5+">5年以上</option>
          </select>
        </div>

        <div class="form-group">
          <label for="job">現在の職種</label>
          <select id="job" required>
            <option value="">選択してください</option>
            <option value="infra">インフラエンジニア</option>
            <option value="ses">SES</option>
            <option value="developer">開発エンジニア</option>
            <option value="ops">運用・保守</option>
            <option value="other">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="target">希望する方向</label>
          <select id="target" required>
            <option value="">選択してください</option>
            <option value="cloud">クラウドエンジニア</option>
            <option value="upstream">設計・構築など上流工程</option>
            <option value="developer">開発エンジニア</option>
            <option value="salary">年収アップを優先</option>
            <option value="undecided">まだ決めていない</option>
          </select>
        </div>

        <div class="form-group">
          <label for="salary">現在の年収</label>
          <select id="salary" required>
            <option value="">選択してください</option>
            <option value="under300">300万円未満</option>
            <option value="300-399">300〜399万円</option>
            <option value="400-499">400〜499万円</option>
            <option value="500+">500万円以上</option>
          </select>
        </div>

        <button class="btn btn-primary btn-full" type="submit">診断結果を見る</button>
      </form>

      <section id="result" class="result-card hidden" aria-live="polite">
        <p class="eyebrow">Your Result</p>
        <h2 id="resultTitle"></h2>
        <p id="resultText"></p>

        <div class="result-points">
          <h3>次に確認したいこと</h3>
          <ul id="resultPoints"></ul>
        </div>

        <div class="service-placeholder">
          <p class="card-label">おすすめ転職サービス</p>
          <p>提携承認後、このエリアに条件に合うサービスを2〜3社表示します。</p>
          <a class="btn btn-secondary" href="compare.html">サービス比較を見る</a>
        </div>

        <p class="note">本診断は一般的な情報をもとにした簡易判定で、転職結果・年収アップ等を保証するものではありません。</p>
      </section>
    </div>
  </main>

  <script src="js/diagnosis.js"></script>
</body>
</html>
